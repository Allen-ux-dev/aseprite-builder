name: Luma Music Android Build

on:
  push:
    branches:
      - luma-music-build-20260926
    paths:
      - 'luma-src.tgz.b64'
      - 'luma-final.patch.gz.b64'
      - '.github/workflows/luma-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Unpack verified Luma base source
        shell: bash
        run: |
          mkdir -p luma
          base64 -d luma-src.tgz.b64 > /tmp/luma-src.tgz
          tar -xzf /tmp/luma-src.tgz -C luma
          sha256sum /tmp/luma-src.tgz

      - name: Apply final UI and playback patch
        working-directory: luma
        shell: bash
        run: |
          base64 -d ../luma-final.patch.gz.b64 | gzip -dc > /tmp/luma-final.patch
          patch --batch --forward -p1 < /tmp/luma-final.patch
          grep -q "recentTracks.map" src/main.jsx
          grep -q "onClick={()=>next()}" src/main.jsx
          grep -q "setSearchFilter(id)" src/main.jsx

      - name: Install dependencies
        working-directory: luma
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        working-directory: luma
        run: npm test

      - name: Build web app
        working-directory: luma
        run: npm run build

      - name: Generate Android project
        working-directory: luma
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: luma/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          cp luma/android/app/build/outputs/apk/debug/app-debug.apk Luma-Music-v0.1.0-debug.apk
          sha256sum Luma-Music-v0.1.0-debug.apk | tee Luma-Music-v0.1.0-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Music-Android
          path: |
            Luma-Music-v0.1.0-debug.apk
            Luma-Music-v0.1.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 3
